name: Application checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan route:list --except-vendor
      - name: Check PHP syntax
        run: find app bootstrap config routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Guard production middleware and filter routes
        run: |
          php artisan route:list --path=api/health | grep 'api/health'
          php artisan route:list --json --path=api/key-findings/filters | grep -F 'Authenticate:sanctum'
      - name: Reject hardcoded mail credentials
        working-directory: .
        run: |
          if git grep -nE "Config::(set|setMany)\(['\"]mail\." -- backend/app; then
            echo "Runtime mail configuration is forbidden; use Coolify environment variables."
            exit 1
          fi
          if git grep -nE "['\"]password['\"][[:space:]]*=>[[:space:]]*['\"][A-Za-z0-9]{12,}['\"]" -- backend/app/Services; then
            echo "Possible hardcoded service password detected."
            exit 1
          fi
          if git ls-files | grep -Eq '^(\.env|backend/\.env)$'; then
            echo "A backend runtime .env file must not be committed."
            exit 1
          fi
          if git grep -nE '^(MAIL_PASSWORD|DB_PASSWORD|APP_KEY|.*(SECRET|TOKEN|PRIVATE_KEY))=' -- 'frontend/.env*'; then
            echo "A sensitive key must not be stored in frontend environment files."
            exit 1
          fi
          grep -F "env('MAIL_USERNAME')" backend/config/mail.php
          grep -F "env('MAIL_PASSWORD')" backend/config/mail.php

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VUE_APP_API_URL: https://kdruresearch.com

name: Application checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: php artisan route:list --except-vendor
      - name: Check PHP syntax
        run: find app bootstrap config routes -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Guard production middleware and filter routes
        run: |
          php artisan route:list --path=api/health | grep 'api/health'
          php artisan route:list -v --path=api/key-findings/filters | grep 'auth:sanctum'

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VUE_APP_API_URL: https://kdruresearch.com
